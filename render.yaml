# =============================================================================
# Render Blueprint — AI Interviewer backend (FastAPI + WebSockets)
# Frontend is deployed separately on Vercel.
#
# Apply in the Render dashboard: New + → Blueprint → connect this repo.
#
# Shape chosen for a $0 deployment:
#   * web service: free instance
#   * database:    external free Postgres (Neon / Supabase), pasted into
#                  DATABASE_URL. Render's own Postgres needs a payment method.
#
# Env vars marked `sync: false` are secrets: Render does not store a value in
# this file, so the dashboard asks you for each one on the first deploy.
# =============================================================================
services:
  - type: web
    name: ai-interviewer-backend
    runtime: python
    plan: free
    # Build from the repo root so the root requirements.txt is detected.
    rootDir: .
    buildCommand: pip install -r requirements.txt
    # Run from backend/ so `app.*` imports resolve; Render assigns $PORT (10000).
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # The root route answers 200 instantly and needs no DB round-trip.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Signs the JWTs. Render generates and stores a strong value on first
      # deploy; the app refuses to start without a non-placeholder key.
      - key: SECRET_KEY
        generateValue: true

      # ── Secrets you must paste in the dashboard ────────────────────────────
      # Neon: use the *pooled* connection string — its host contains -pooler,
      # e.g. ep-xxxx-pooler.<region>.aws.neon.tech — because a voice interview
      # keeps one connection open for the whole session. Keep ?sslmode=require
      # (Neon rejects plaintext). Paste it exactly as Neon gives it; app/config.py
      # rewrites the scheme to postgresql+psycopg2:// so SQLAlchemy always loads
      # the driver that is installed — a bare postgresql:// resolves to psycopg
      # (v3) on SQLAlchemy 2.1 and crashed the boot with "No module named
      # 'psycopg'", and the legacy postgres:// alias does not resolve at all.
      - key: DATABASE_URL
        sync: false
      # Allowed browser origin(s). Deliberately NOT sync: false — an allowed
      # origin is public information (it ships in every CORS response header), so
      # keeping it in the manifest beats a dashboard prompt that is easy to skip.
      # A blank value produces a *healthy-looking* deploy: GET / answers 200 and
      # curl works, while every browser call dies on a rejected preflight and the
      # SPA reports it as an unreachable server.
      # Exact origin: https scheme, no trailing slash, no path. Append preview
      # deployments comma-separated if they should reach the API too.
      - key: BACKEND_CORS_ORIGINS
        value: "https://ai-interviewer-qtbg.vercel.app"
      # Powers question generation, answer evaluation, behavioral analysis and
      # Whisper transcription. Everything still runs on fallbacks without it,
      # but the interview quality drops to the static question bank.
      - key: GROQ_API_KEY
        sync: false
      # Deliberately omitted: DEEPGRAM_API_KEY, NVIDIA_API_KEY, DASHSCOPE_API_KEY,
      # CHROMA_PATH and UPLOAD_DIR all have working defaults or graceful
      # fallbacks, so the blueprint does not prompt for them. Add any of them
      # later in Environment if you want those providers.

      # ── Tunables (defaults are fine; change only if needed) ────────────────
      - key: MAX_FOLLOW_UPS_PER_QUESTION
        value: "1"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"
      - key: GROQ_STT_MODEL
        value: "whisper-large-v3"

# No `databases:` block on purpose: that provisions a Render-managed Postgres,
# which requires a payment method. The app creates its own schema on first boot
# (Base.metadata.create_all + the idempotent _ensure_schema() column/index
# upgrades in backend/app/main.py), so an empty Neon database is ready to use
# as soon as it is pointed at DATABASE_URL.
#
# FREE-TIER LIMITS worth knowing before you demo this to anyone:
#   1. The instance spins down after ~15 min without traffic; the next request
#      takes ~50 s to cold-start and an in-progress WebSocket interview is
#      dropped. useWebSocket reconnects every 3 s, so the candidate resumes
#      where they left off (question progress is stored server-side).
#      Keep-warm workaround: a UptimeRobot ping of https://<svc>.onrender.com/
#      every 14 min, or upgrade this service to Starter ($7/mo) — no other
#      change is needed.
#   2. The filesystem is ephemeral: uploaded resumes under backend/uploads are
#      lost on redeploy. Interview data itself is safe in Postgres. To keep
#      files, upgrade to Starter and attach a Persistent Disk, then set
#      UPLOAD_DIR to its mount path.
#   3. 512 MB RAM. The trimmed requirements.txt no longer installs torch, so
#      the running process sits well inside that; if it is ever OOM-killed,
#      the fix is to switch plan, not to add dependencies back.
